<!--
  "Confirm signup" email. The link opens the app's /confirm page, where a tap
  spends the one-time token, so mail scanners that open links can't use it up.
  Production: paste into Supabase → Authentication → Emails → Confirm signup.
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px 12px;background:#FFF6EC;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#150F2E;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#FFFFFF;border-radius:20px;">
            <tr>
              <td style="padding:32px 28px;">
                <p style="margin:0 0 8px;font-size:14px;font-weight:700;color:#6C4DFF;">RecallMate</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:30px;">Confirm your email</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#4A4466;">
                  Tap the button to finish setting up your account. It opens RecallMate, where one more tap confirms it.
                </p>
                <a href="{{ .SiteURL }}/confirm?token_hash={{ .TokenHash }}&type=email"
                   style="display:inline-block;padding:14px 24px;border-radius:14px;background:#6C4DFF;color:#FFFFFF;font-size:16px;font-weight:700;text-decoration:none;">
                  Confirm my email
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#8A84A3;">
                  Didn’t sign up for RecallMate? You can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
